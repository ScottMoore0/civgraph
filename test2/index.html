<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Civgraph moved</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    body {
      align-items: center;
      display: flex;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 560px;
    }
    a {
      color: #0f4c81;
      font-weight: 700;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        background: #0b1220;
        color: #eef6ff;
      }
      a {
        color: #9ecbff;
      }
    }
  </style>
  <script>
    (() => {
      const nextUrl = new URL('/maps/', window.location.origin);
      nextUrl.search = window.location.search;
      nextUrl.hash = window.location.hash;
      window.location.replace(nextUrl.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Civgraph has moved</h1>
    <p>The map app now lives at <code>/maps/</code>. Old <code>/test2</code> links are redirected automatically while bookmarks settle.</p>
    <p><a id="redirectLink" href="/maps/">Continue to Civgraph</a></p>
  </main>
  <script>
    const link = document.getElementById('redirectLink');
    const nextUrl = new URL('/maps/', window.location.origin);
    nextUrl.search = window.location.search;
    nextUrl.hash = window.location.hash;
    link.href = nextUrl.href;
  </script>
</body>
</html>
