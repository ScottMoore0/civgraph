name: Test rewrite readiness

on:
  pull_request:
    paths:
      - 'render/**'
      - 'src/**'
      - 'app/build/**'
      - 'scripts/*test*.mjs'
      - 'scripts/verify-test-pmtiles-cdn.mjs'
      - 'scripts/validate-test-cdn-manifest.mjs'
      - 'scripts/validate-intake-delivery.mjs'
      - 'scripts/validate-source-paths.mjs'
      - 'scripts/validate-composite-composition.mjs'
      - 'scripts/parse-phelim-ed-notes.mjs'
      - 'data/intake/**'
      - 'package.json'
      - '.github/workflows/test-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'render/**'
      - 'src/**'
      - 'app/build/**'
      - 'scripts/*test*.mjs'
      - 'scripts/verify-test-pmtiles-cdn.mjs'
      - 'scripts/validate-test-cdn-manifest.mjs'
      - 'scripts/validate-intake-delivery.mjs'
      - 'scripts/validate-source-paths.mjs'
      - 'scripts/validate-composite-composition.mjs'
      - 'scripts/parse-phelim-ed-notes.mjs'
      - 'data/intake/**'
      - 'package.json'
      - '.github/workflows/test-readiness.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # --ignore-scripts: canvas builds natively and fails on the runner (pixman-1).
      - run: npm ci --ignore-scripts
      - run: npm run build:test
      - run: npm run check:test:ci-safe
      # Delivery reconciliation, source-path and composite-composition checks.
      # Offline and fast; the daily schedule is what turns a month of silent
      # drift into at most a day of it.
      - run: npm run check:intake
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:test
      # The spec that asserts the catalogue pane renders with a clean console.
      # It is also in production-parity below, but that job is schedule-only, so
      # nothing ran it before a deploy: a357cc5c66 put `catalogueV2` in its own
      # temporal dead zone, every load threw "Cannot access 'm' before
      # initialization", the pane rendered blank, and the nightly caught it
      # sixteen hours later. Local is the default base URL (see
      # tests/browser/helpers/base-url.js) and playwright.config.js starts the
      # server itself, so this measures the working tree. 4.7s locally.
      - run: npx playwright test tests/browser/catalogue-load-a11y.spec.js
      - run: npm run test:visual:test

  mobile-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # --ignore-scripts: canvas builds natively and fails on the runner (pixman-1).
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build:test
      - run: npm run smoke:test:mobile
      - run: npm run test:performance:test

  production-parity:
    # The six specs that measure the DEPLOYED site rather than the working tree.
    # They used to default to https://civgraph.net and run inside every local
    # `npx playwright test`, so a green local run said nothing about local changes in
    # them, and a broken deployment failed unrelated local work. Local is now the
    # default (tests/browser/helpers/base-url.js); production is checked here, on
    # purpose, on the schedule -- not on every push, which would hammer the live site.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PARITY_BASE_URL: https://civgraph.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/browser/ux-plan-items.spec.js
          tests/browser/ux-t1-05-t1-03.spec.js
          tests/browser/catalogue-load-a11y.spec.js
          tests/browser/eds-1931-1936.spec.js
          tests/browser/elections-api-fallback.spec.js
          tests/browser/elections-api-parity.spec.js

  cdn-byte-range-monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # --ignore-scripts: canvas builds natively and fails on the runner (pixman-1).
      - run: npm ci --ignore-scripts
      - run: npm run build:test:cdn-manifest
      - run: npm run monitor:test:cdn
