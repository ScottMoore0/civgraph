name: Pages build parity

# Reproduces the Cloudflare Pages build on a clean checkout, on EVERY commit.
#
# WHY THIS EXISTS
#
# On 2026-08-11 the Pages build was found to have been failing for 18
# consecutive deployments. The site never went down -- Pages keeps serving the
# last successful deployment -- so the only symptom was that nothing shipped,
# silently, for a day's work.
#
# Three separate gaps had to line up for that to go unnoticed, and this workflow
# closes all three:
#
#   1. `npm run check` runs 26 validators but never runs `npm run build`. A
#      green check suite therefore says nothing about whether the tree builds.
#   2. data-readiness.yml is path-filtered to data/**, scripts/validate-*.mjs,
#      scripts/graph/** and package.json. The commit that broke the build only
#      touched scripts/build-*.mjs and js/ -> src/, so it matched no filter and
#      ran no CI at all. This workflow has NO path filter, deliberately.
#   3. Both failures were invisible locally because the working tree still had
#      files a clean checkout does not: the js/ -> src/ rename left stale
#      imports that only a real resolve would hit, and untracking data/maps
#      removed *-chunks.json files that validate-chunked-map-bounds needed but
#      that still existed on the developer's disk. A hosted runner starts from
#      git alone, which is the honest test.
#
# The build command below must stay IDENTICAL to the Pages project setting,
# including `--ignore-scripts`. If they drift, this workflow stops testing the
# thing it exists to test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Exactly what Cloudflare Pages runs, in the same order. Split into steps
      # so a failure names the stage rather than the whole command.
      # Deliberately `npm install`, not `npm ci`, even though the other workflows
      # use ci. This job exists to reproduce the Cloudflare build; pinning to the
      # lockfile here would stop it reproducing the thing it is named after, and
      # a dependency that resolves differently on Cloudflare is exactly the kind
      # of breakage it should catch.
      - name: npm install (--ignore-scripts, as Pages does)
        run: npm install --ignore-scripts

      - name: npm run build
        run: npm run build

      # BEFORE the clean step, because clean-for-pages.sh deletes scripts/ and
      # this lives there. Running it afterwards failed with MODULE_NOT_FOUND on
      # every commit from 2026-08-11 to 2026-08-12 -- the gate built to catch a
      # broken build was itself broken, and red for reasons unrelated to the build.
      #
      # Order is not a compromise: this script models the deployable set from git
      # plus .cfignore, so it does not need the cleaned tree and never did.
      - name: Assert modelled deployable file count under budget
        run: node scripts/validate-pages-file-budget.mjs

      - name: clean-for-pages.sh
        run: bash scripts/clean-for-pages.sh

      # Ground truth, after cleaning: what is actually on disk. Pages hard-fails
      # an upload above 20,000 files.
      #
      # This is an UPPER BOUND, not the deployed count -- Cloudflare applies
      # .cfignore at upload, removing more (data/census, data/browse, data/graph
      # and so on) than clean-for-pages.sh does. So it can only over-count, which
      # is the safe direction for a ceiling check. It exists because the modelled
      # count above has been wrong twice: once from a hand-maintained exclusion
      # list that drifted from .cfignore (reported 13,562 against a real ~20,944),
      # and once from trusting .cfignore glob patterns that Cloudflare ignores.
      - name: Assert real on-disk file count under Cloudflare's hard limit
        run: |
          COUNT=$(find . -path ./.git -prune -o -type f -print | wc -l)
          echo "files on disk after clean-for-pages.sh: $COUNT (hard limit 20000)"
          if [ "$COUNT" -ge 20000 ]; then
            echo "::error::$COUNT files on disk; Cloudflare Pages hard-fails at 20,000."
            exit 1
          fi
