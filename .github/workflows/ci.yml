# CI: one workflow, the CI tier of CHECKS.md (site-restructure DESIGN.md 4.2).
#
# It runs what a developer runs, on a clean checkout:
#
#   check         npm run check:ci = the Pages build, the derived inputs the checks still
#                 read (the records database, maps and catalogue included, and its tests), then
#                 every offline check (scripts/check/clean.mjs --in-place); then the browser
#                 specs of the production map app at /maps/ (npm run test:browser:maps),
#                 in the same job because they read the records build's election documents
#                 (scripts/test-server.py serves them from tmp/records, as the compatibility
#                 Functions serve them from D1). Locally, npm run check:clean runs the same
#                 checks on a clean export of the tree, so a check that needs a gitignored
#                 file fails in both places or neither.
#   pages-build   the Pages build exactly as Cloudflare runs it, plus the file-count limits.
#
# No path filters, on purpose: a validator whose inputs fall outside a filter never runs
# (the docs/** gap closed on 2026-09-20 was one), so every push and pull request runs
# everything. scripts/check/rules/ci-workflow.mjs (npm run check:ci-workflow, in `check`)
# keeps it that way.
#
# Nothing here needs a secret or reaches production: no remote D1 or R2, no request to
# civgraph.net. The checks against the deployed site and the live databases are the opt-in
# remote tier, run by hand after a publish (npm run verify, npm run verify:public).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # check:graph rebuilds the graph to assert determinism; the records build is the long pole.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Python runs the person-id stamping inside records:build (scripts/records/) and the
      # Playwright suite's static server (scripts/test-server.py).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The records build needs room: on a clean export it wrote 10.8 GB under tmp/records
      # (the 3.2 GB database, the order test's 3.4 GB reverse-loaded copy, and the election,
      # Browse and graph trees), against the 14 GB a standard runner guarantees. The runner
      # image's unused toolchains are removed first; df shows the room before and after.
      - name: Free disk space for the records build
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # npm ci, not npm install: check:notices compares exact installed versions with the
      # committed notices. --ignore-scripts: the canvas devDependency builds natively and
      # fails on the runner (pixman-1); nothing in the checks imports it.
      - run: npm ci --ignore-scripts
      - run: npm run check:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:maps
      - if: always()
        run: df -h / && du -sh tmp/records 2>/dev/null || true

  pages-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Exactly the Pages build command (wrangler.toml records it): npm install, not npm ci.
      - name: npm install (--ignore-scripts, as Pages does)
        run: npm install --ignore-scripts
      # npm run build, then scripts/build/site.mjs writes dist/ (the Pages output) from its
      # allow-list and fails above the 18,500-file guardrail or on a file over 25 MiB.
      - name: npm run build:site
        run: npm run build:site
      - name: Assert real file count in dist/ under Cloudflare's hard limit
        run: |
          COUNT=$(find dist -type f | wc -l)
          echo "files in dist/: $COUNT (hard limit 20000)"
          if [ "$COUNT" -ge 20000 ]; then
            echo "::error::$COUNT files in dist/; Cloudflare Pages hard-fails at 20,000."
            exit 1
          fi
