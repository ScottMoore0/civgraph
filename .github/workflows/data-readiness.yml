name: Data readiness

# test-readiness.yml only fires on render/**, scripts/*test*.mjs and package.json.
# Data-only commits -- the large majority, since data/ is roughly half of all
# tracked files -- matched no path filter and shipped unvalidated. This closes
# that gap, most importantly by running the approved-publication gate
# (validate-approved-publication-path.mjs) on every data change.

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate-*.mjs'
      - 'scripts/graph/**'
      - 'package.json'
      - '.github/workflows/data-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/validate-*.mjs'
      - 'scripts/graph/**'
      - 'package.json'
      - '.github/workflows/data-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    # `npm run check` is 19 validators and includes check:graph, which rebuilds
    # data/graph (~2 GB) TWICE to assert determinism. That is slow and
    # disk-hungry on a hosted runner (~14 GB free), so this timeout is generous
    # and the job is expected to need tuning after its first real run --
    # possibly by splitting check:graph out onto a schedule. Verified green
    # locally 2026-08-07 (exit 0, 19 passes); never yet executed in CI.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # `npm ci`, not `npm install`, now that package-lock.json is tracked
      # (un-ignored 2026-08-12). This matters here specifically because
      # check:notices regenerates
      # app/build/THIRD-PARTY-NOTICES.txt from what is actually installed and
      # compares it to the committed file. `npm install` may resolve versions
      # newer than the lockfile, and the notices record exact versions
      # (fflate@0.8.3 and so on), so the check failed as "missing or out of date"
      # for a dependency drift rather than any real problem.
      #
      # --ignore-scripts: the `canvas` devDependency builds natively and fails on
      # the runner (pixman-1 not found). Nothing in `npm run check` imports it --
      # canvas is only used by the thumbnail and raster builders.
      - run: npm ci --ignore-scripts

      # check:asset-refs asserts that every referenced asset exists AFTER THE
      # BUILD, and build/ is gitignored, so on a clean checkout main.css,
      # main.critical.css and about.css do not exist yet. This job ran `npm run
      # check` without ever building them and failed on all 5 every time since it
      # was added -- green locally only because those files sit untracked on the
      # developer's disk. That is the same shape as the *-chunks.json breakage.
      #
      # Only the shell assets are built, not the full `npm run build`: this is the
      # cheapest step that satisfies the validator, and pages-build.yml already
      # covers the full build separately.
      - run: node scripts/build-shared-shell-assets.mjs

      # data/browse became untracked build output on 2026-08-12 (served from R2).
      # Several validators in `npm run check` read it -- check:external-sources,
      # check:raw-source-documents, check:medium-priority-publication -- and
      # without this they either skip or, worse, report every record as missing.
      # Building it here means they actually run in CI rather than quietly
      # covering nothing, which is the whole reason this job exists.
      #
      # Reads only tracked inputs (data/database/*.json), so a clean checkout is
      # enough: verified locally 2026-08-12 by rebuilding from scratch and
      # re-running check:external-sources, which passed.
      - run: node scripts/build-browse-indexes.mjs

      # check:catalogue-sql compares data/database/catalogue-d1-import.sql to what
      # the builder would emit, but that file is gitignored (build output, 1.3 MB),
      # so on a clean checkout it does not exist and the check fails outright --
      # the same shape as main.css and data/browse above, green locally only
      # because the file sits untracked on the developer's disk.
      #
      # Reads only data/database/maps.json, which is tracked, so a clean checkout
      # is enough. Generating it here also means the check actually compares
      # something rather than failing on a missing input.
      - run: node scripts/build-catalogue-d1-import.mjs

      # Same again for check:browse-index-sql, which compares the three
      # *-d1-import.sql files to the data/browse indexes built above. Both sides
      # are gitignored, and only the indexes were being built, so the check
      # reported all three as stale on every run (a missing file reads as stale).
      #
      # Worth being clear about what this buys: with both sides generated from
      # the same inputs the comparison cannot catch drift here -- that gate only
      # means something on a developer disk, before a deploy. What CI does get is
      # the builders themselves running against real data, which is where the
      # per-statement D1 size limits and the empty-index guards are enforced.
      - run: node scripts/build-browse-index-d1-import.mjs --all

      - run: npm run check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      # Warnings only by design -- reports without blocking. Switch to
      # lint:strict once the current 16 warnings are cleared.
      - run: npm run lint
