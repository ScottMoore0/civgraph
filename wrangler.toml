# Cloudflare Pages configuration for civgraph.
#
# ACTIVE. Pages reads this file and it is AUTHORITATIVE: dashboard bindings are
# ignored once it exists, and any binding missing here disappears from
# production, taking its Functions to `503 ... binding not configured`.
#
# Every value below was read back from the Pages API on 2026-08-11 and
# reproduces the then-live configuration exactly, including the deliberate
# difference between environments: preview has only PRONI_DB and PRONI_KV, not
# the full production set. That asymmetry is preserved rather than "tidied up",
# because widening preview's access to production D1, KV and R2 is a decision in
# its own right, not a side effect of moving config into the repository.
#
# The build command is NOT part of this file -- Pages keeps it as a project
# setting. For the record it is:
#
#     npm install --ignore-scripts && npm run build && bash scripts/clean-for-pages.sh
#
# and scripts/clean-for-pages.sh trimming the output below Cloudflare's
# 20,000-file limit is load-bearing.
#
# WHAT IS DELIBERATELY ABSENT
#
# Environment variables. The project has none set, and CIVGRAPH_ADMINS /
# CIVGRAPH_CONTRIBUTORS are email addresses -- personal data, and this repository
# is public, so they must never appear here. They belong in Pages secrets:
#
#     npx wrangler pages secret put CIVGRAPH_ADMINS --project-name civgraph
#
# The fail-open warning that used to sit here is obsolete as of 2026-08-13.
# _auth.js previously read `!allowlistConfigured ||` and treated an unset
# allowlist as "allow anyone authenticated"; it is now fail-closed, so an unset
# list means nobody. Access can therefore be enabled before the lists exist
# without opening anything -- though there would be no point, since nobody would
# get through.
#
# CIVGRAPH_ALLOW_DEV_AUTH must remain unset in production. With
# CIVGRAPH_DEV_AUTH_EMAIL it disables authentication entirely; it now takes both
# variables, so a single mistaken copy cannot do it. Verified unset on
# 2026-08-13: /_api/auth/status reports source "anonymous", which it could not do
# if the bypass were active.
#
# The quarantine bucket for file intake (CIVGRAPH_QUARANTINE, read by
# functions/_api/contributions/intake.js) is deliberately NOT bound. It must be a
# private bucket -- not boundaries-data, no public custom domain -- and accepting
# third-party uploads should begin with a deliberate act of configuration rather
# than arrive as a side effect of a deploy. Absent the binding, intake returns 503.
#
# TO ROLL BACK: delete this file and redeploy. The dashboard configuration is
# unchanged underneath and resumes.

name = "civgraph"

# Must match what production runs. Changing this changes Workers runtime
# behaviour and is a deliberate change to make on its own.
compatibility_date = "2026-04-04"

# The site is served from the repository root -- index.html, 404.html and
# _headers are all top level. Equivalent to the project's empty destination_dir.
pages_build_output_dir = "."


# ---------------------------------------------------------------------------
# Production
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "PRONI_DB"
database_name = "proni-catalogue"
database_id = "a66d0846-6186-460d-a7b2-e88918a6b341"

[[d1_databases]]
binding = "CATALOGUE_DB"
database_name = "civgraph-catalogue"
database_id = "d7ed9845-ba30-4925-956c-d6bde885cb30"

[[d1_databases]]
binding = "ELECTIONS_DB"
database_name = "civgraph-elections"
database_id = "cd88f241-35aa-4cbb-bcb3-c80a471b8afa"
# Records schema (scripts/records/, data design phase 2): append-only files, applied by
# npm run records:deploy (wrangler d1 migrations apply) before each delta load.
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "PRONI_KV"
id = "ef19e1065f854619a19e2cbd62b28f82"

[[kv_namespaces]]
binding = "SPATIAL_INDEX"
id = "c88a99b42d6d4ce7aba6ba94dce47e5a"

# Contribution queue. Created 2026-08-13.
#
# Binding this does NOT open contributions. submit.js requires an authenticated
# caller who appears in CIVGRAPH_CONTRIBUTORS or CIVGRAPH_ADMINS, both of which
# are unset -- and both are now fail-closed, so an unset list means nobody.
# Without Cloudflare Access in front there is no authenticated caller at all, so
# the endpoint answers 401 before it ever reaches this namespace.
#
# Production only. Preview stays narrow, as with every other binding here: a
# preview deployment must not be able to write into the real review queue.
[[kv_namespaces]]
binding = "CIVGRAPH_CONTRIBUTION_QUEUE"
id = "fca3f869f723456a9ca494155b586383"

[[r2_buckets]]
binding = "MAPS_BUCKET"
bucket_name = "boundaries-data"


# ---------------------------------------------------------------------------
# Preview — intentionally narrower than production, as it already was.
# Preview deployments of Functions needing ELECTIONS_DB, SPATIAL_INDEX or
# MAPS_BUCKET will 503; that is the pre-existing behaviour, not a regression.
# ---------------------------------------------------------------------------

[env.preview]
compatibility_date = "2026-04-04"

[[env.preview.d1_databases]]
binding = "PRONI_DB"
database_name = "proni-catalogue"
database_id = "a66d0846-6186-460d-a7b2-e88918a6b341"

[[env.preview.kv_namespaces]]
binding = "PRONI_KV"
id = "ef19e1065f854619a19e2cbd62b28f82"
