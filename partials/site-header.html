<header class="app-header" data-site-chrome data-header-layout="{{layout}}">
<a class="app-header__brand" href="/">
<img alt="" class="app-header__logo-icon" src="/assets/pages/img/bd2feea987bf.svg"/>
<span class="app-header__wordmark">Civgraph</span>
</a>
<button aria-controls="mainNav" aria-expanded="false" aria-label="Open navigation" class="mobile-menu-toggle" type="button">

</svg>
<svg aria-hidden="true" class="mobile-menu-toggle__close" data-icon="lucide" data-icon-name="x" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>
</svg>
</button>
<nav aria-label="Main navigation" class="app-header__nav" id="mainNav">
<a class="app-header__link{{active:home}}" href="/"{{current:home}}><svg aria-hidden="true" class="icon" data-icon="lucide" data-icon-name="house" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>

<circle cx="11" cy="11" r="8"></circle>
<path d="m21 21-4.3-4.3"></path></svg><span>Browse</span></a>
<a class="app-header__link{{active:apps}}" href="/apps/"{{current:apps}}><svg aria-hidden="true" class="icon" data-icon="lucide" data-icon-name="layout-grid" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<rect height="7" rx="1" width="7" x="3" y="3"></rect>

<circle cx="12" cy="12" r="10"></circle>
