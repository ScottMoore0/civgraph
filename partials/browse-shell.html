  <main id="main-content" class="browse-shell">
    <aside class="browse-sidebar" aria-label="Browse sections">
      <div class="browse-search">
        <label class="visually-hidden" for="browseSearch">Search browse data</label>
        <svg class="browse-search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input id="browseSearch" class="browse-search__field" type="search" placeholder="Search maps, elections, people...">
      </div>
      <nav id="browseGroups" class="browse-groups" aria-label="Browse data groups"></nav>
      <!-- After the sections, not above them: signed out it is one line inviting contributors
           to log in, and it no longer comes before the page's heading. -->
      <section id="contributorPanel" class="contributor-panel" aria-label="Contributor tools"></section>
    </aside>

    <section class="browse-content">
      <div id="browseHero" class="browse-hero"></div>

      <!-- Inline contributor editor. Deliberately a SIBLING of #browseResults,
           not a child: browseResults has its innerHTML replaced on every
           navigation, which would destroy a half-written proposal without
           warning. -->
      <section id="contributorEditor" class="contributor-inline" hidden aria-labelledby="contributorEditorTitle">
        <header class="contributor-inline__header">
          <h2 id="contributorEditorTitle" class="contributor-inline__title">Propose edit</h2>
          <button type="button" class="contributor-btn" data-contributor-close>Cancel</button>
        </header>
        <div id="contributorEditorSlot"></div>
      </section>

      <!-- Not a live region: every list and record replaced its whole content, so a screen
           reader read out up to 200 cards on each view. browse.js announces a short summary
           ("Persons: 7 records matching Paisley", "Loaded Ian Paisley") through #announcer. -->
      <div id="browseResults" class="browse-results"></div>
    </section>
  </main>

  <div id="contributorModal" class="contributor-modal hidden" role="dialog" aria-modal="true" aria-labelledby="contributorModalTitle">
    <div class="contributor-modal__backdrop" data-contributor-close></div>
    <section class="contributor-modal__panel">
      <header class="contributor-modal__header">
        <h2 id="contributorModalTitle">Contributor submission</h2>
        <button type="button" class="contributor-modal__close" data-contributor-close aria-label="Close">×</button>
      </header>
      <form id="contributorForm" class="contributor-form"></form>
    </section>
  </div>
