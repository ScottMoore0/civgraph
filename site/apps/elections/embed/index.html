<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Not public yet (owner, 11 Nov 2026): never indexed. A prototype of the embeddable result widget. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Civgraph Elections widget</title>
  <link rel="stylesheet" href="/assets/ui/tokens.css">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: var(--font-sans, system-ui, sans-serif); background: var(--surface, #fff); color: var(--text, #1a202c); }
    .w { box-sizing: border-box; max-width: 34rem; padding: 12px 14px; border: 1px solid var(--border, #d3dcdf); border-radius: 10px; }
    .w h1 { margin: 0; font-size: 1.05rem; line-height: 1.3; }
    .w h1 a { color: inherit; text-decoration: none; }
    .w .meta { margin: 2px 0 8px; font-size: 0.8rem; color: var(--text-muted, #4a5568); }
    .w svg { display: block; width: 100%; height: auto; max-width: 22rem; margin: 0 auto; color: var(--text-muted, #4a5568); }
    .w table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 6px; }
    .w th, .w td { padding: 3px 4px; border-bottom: 1px solid var(--border-subtle, #e5ebee); text-align: left; }
    .w td.n, .w th.n { text-align: right; font-variant-numeric: tabular-nums; }
    .w .sw { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
    .w footer { margin-top: 6px; font-size: 0.75rem; color: var(--text-muted, #4a5568); }
    .w footer a { color: var(--link, #0b5cad); }
  </style>
  <script type="module" src="/apps/elections/embed/embed.js"></script>
</head>
<body>
  <div class="w" id="w" aria-live="polite">Loading…</div>
</body>
</html>
